name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: "swift ${{ matrix.swift }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        swift: ["6.0", "6.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift }}
      - name: build
        run: swift build
      - name: test
        run: swift test
      - name: release build
        run: swift build -c release
